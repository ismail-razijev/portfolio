databases:
  - name: mirasia-db
    plan: free
    databaseName: mirasia
    user: mirasia

services:
  - type: web
    name: mirasia-gestion
    runtime: node
    rootDir: mirasia-gestion
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mirasia-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
