<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirasia Gestion - Comptes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="users.html" data-roles="admin">
  <header class="topbar">
    <h1>👥 Comptes staff</h1>
  </header>
  <main>
    <div class="card">
      <h2>Comptes staff</h2>
      <form class="inline-form" id="form-user">
        <label>Identifiant
          <input type="text" name="username" required placeholder="Ex: sara" />
        </label>
        <label>Nom complet
          <input type="text" name="nom_complet" placeholder="Ex: Sara D." />
        </label>
        <label>Rôle
          <select name="role" required>
            <option value="admin">Admin</option>
            <option value="cuisine">Cuisine</option>
            <option value="salle">Salle</option>
          </select>
        </label>
        <label>Mot de passe
          <input type="password" name="password" required placeholder="Mot de passe initial" />
        </label>
        <button type="submit">Créer</button>
      </form>
      <p class="error-msg" id="error-user" hidden></p>
      <table id="table-users">
        <thead><tr><th>Identifiant</th><th>Nom complet</th><th>Rôle</th><th>Actif</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="empty" id="empty-users" hidden>Aucun compte pour l'instant.</p>
    </div>
  </main>
  <script src="guard.js"></script>
  <script src="nav.js"></script>
  <script src="users.js"></script>
</body>
</html>
