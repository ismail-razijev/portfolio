<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirasia Gestion - Connexion</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-shell {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .login-brand {
      background: var(--ink);
      position: relative;
      padding: 2.2rem;
      display: flex;
      flex-direction: column;
      color: var(--paper);
    }
    .login-brand::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.4;
      background:
        repeating-linear-gradient(45deg, #2f2620 0 12px, transparent 12px 24px),
        repeating-linear-gradient(-45deg, #2f2620 0 12px, transparent 12px 24px);
    }
    .login-brand > * { position: relative; }
    .login-brand-title { font-family: var(--font-display); font-size: 2.1rem; line-height: 1; }
    .login-brand-subtitle {
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      color: #b8836a; margin-top: 0.55rem;
    }
    .login-brand-tagline {
      margin-top: auto;
      font-family: var(--font-display);
      font-size: 1.25rem;
      line-height: 1.35;
    }
    .login-brand-meta { font-size: 0.78rem; color: #a2968c; margin-top: 0.7rem; }
    .login-brand-stripe {
      height: 5px;
      margin-top: 1.2rem;
      background: repeating-linear-gradient(90deg, var(--terracotta) 0 12px, var(--safran) 12px 24px, var(--olive) 24px 36px);
    }
    .login-form-side { background: var(--paper); padding: 2.4rem 2.2rem; display: flex; flex-direction: column; justify-content: center; }
    .login-form-side h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; }
    .login-form-side .login-subtitle { color: var(--text-muted); font-size: 0.85rem; margin: 0.4rem 0 1.4rem; }
    .login-form-side form { display: flex; flex-direction: column; gap: 1rem; }
    .login-form-side label {
      display: flex; flex-direction: column; gap: 0.35rem;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8a817a;
    }
    .login-form-side button { margin-top: 0.3rem; }

    @media (max-width: 620px) {
      .login-shell { grid-template-columns: 1fr; }
      .login-brand { padding: 1.6rem; }
      .login-brand-tagline { margin-top: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-brand">
      <div class="login-brand-title">Mirasia</div>
      <div class="login-brand-subtitle">Gestion interne</div>
      <div class="login-brand-tagline">Cuisine d'Asie centrale<br />et du Caucase.</div>
      <div class="login-brand-meta">Verviers, Belgique · service 12h–22h</div>
      <div class="login-brand-stripe"></div>
    </div>
    <div class="login-form-side">
      <h1>Connexion</h1>
      <p class="login-subtitle">Identifiants fournis par le gérant</p>
      <form id="form-login">
        <label>Identifiant
          <input type="text" name="username" required autofocus />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required />
        </label>
        <button type="submit">Se connecter</button>
      </form>
      <p class="error-msg" id="error-login" hidden></p>
    </div>
  </div>
  <script src="html.js"></script>
  <script src="login.js"></script>
</body>
</html>
