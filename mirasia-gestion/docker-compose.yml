services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mirasia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/db/migration_v1_2.sql:/docker-entrypoint-initdb.d/02_migration_v1_2.sql
      - ./src/db/migration_v1_3.sql:/docker-entrypoint-initdb.d/03_migration_v1_3.sql
      - ./src/db/migration_v1_4.sql:/docker-entrypoint-initdb.d/04_migration_v1_4.sql
      - ./src/db/migration_v1_5.sql:/docker-entrypoint-initdb.d/05_migration_v1_5.sql
      - ./src/db/migration_v1_6.sql:/docker-entrypoint-initdb.d/06_migration_v1_6.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"

volumes:
  pgdata:
